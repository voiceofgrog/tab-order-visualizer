# On every push to main and every pull request: type-check, run the Playwright tests, build,
# and (main only) publish dist/site to GitHub Pages.
#   - Linux: Chromium runs every test; Firefox runs the real-key-press comparisons.
#   - macOS: WebKit runs the real-key-press comparisons. WebKit on macOS follows the system's
#     default keyboard settings, so it is the closest stand-in for real Safari (WebKit on
#     Linux tabs to everything, unlike Safari).
name: Test and publish site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One run at a time per branch, so main deploys never overlap and pull requests do not queue behind them.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright test --project=chromium --project=firefox
      - name: Package the extension for download
        run: cd dist && zip -r site/tab-order-visualizer-extension.zip extension
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - name: Keep the test report if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-linux
          path: playwright-report
          retention-days: 7

  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run build
      - run: npx playwright test --project=webkit
      - name: Keep the test report if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-macos
          path: playwright-report
          retention-days: 7

  deploy:
    needs: [build, safari]
    # Only main publishes; pull requests (including Dependabot updates) are tested, never deployed.
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
