<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab order demo: a well-built page (false-positive check)</title>
<style>
  /* Fix for the sticky header: the browser scrolls focused items clear of it. */
  html { scroll-padding-top: 100px; }
  body { margin: 0; font: 18px/1.5 Georgia, serif; color: #222; }
  .skip-link { position: absolute; left: -9999px; top: 0; }
  .skip-link:focus { left: 1rem; top: 1rem; z-index: 100; background: #fff; padding: .5rem; }
  .site-header { position: sticky; top: 0; z-index: 10; height: 80px; background: #e6eef3;
    display: flex; align-items: center; gap: 1.5rem; padding: 0 1rem; }
  .site-header nav a { margin-right: 1rem; }
  .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; max-width: 60rem; margin: 0 auto; padding: 0 1rem; }
  footer { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  .filler { height: 60rem; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header">
  <p><strong>Example University</strong></p>
  <nav aria-label="Main">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
  <input type="search" aria-label="Search the site">
</header>

<div class="layout">
  <main id="main">
    <h1>Admissions</h1>
    <p>Read about <a href="#apply">how to apply</a> and <a href="#fees">fees</a>.</p>
    <h2>Ask a question</h2>
    <form onsubmit="return false">
      <p><label>Name <input type="text" name="name"></label></p>
      <p><label>Email <input type="email" name="email"></label></p>
      <p><button type="button">Send</button></p>
    </form>
    <div class="filler"></div>
    <p><a href="#top">Back to top</a></p>
  </main>
  <aside aria-label="Related">
    <h2>Related</h2>
    <p><a href="#visit">Visit us</a></p>
    <p><a href="#funding">Funding</a></p>
  </aside>
</div>

<footer><p><a href="#privacy">Privacy</a> <a href="#accessibility">Accessibility</a></p></footer>
<script src="/dist/tov-full.js"></script>
</body>
</html>
