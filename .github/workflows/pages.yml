# On every push to main: type-check, run the Playwright tests, build, and publish dist/site
# to GitHub Pages. Publishing is skipped while the repository is private (free GitHub
# accounts can only publish Pages from public repositories).
name: Test and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Package the extension for download
        run: cd dist && zip -r site/tab-order-visualizer-extension.zip extension
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Keep the test report if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
